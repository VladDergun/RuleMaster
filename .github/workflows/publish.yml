name: Publish to NuGet

# Publishes RuleMaster to nuget.org using Trusted Publishing (OIDC) - no long-lived API key.
# Trigger: push a tag like v1.1.0 whose version matches <PackageVersion> in RuleMaster.csproj.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the "Environment" field of the nuget.org Trusted Publishing policy.
    environment: nuget
    permissions:
      contents: read
      id-token: write # lets the job request a GitHub OIDC token for nuget.org

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          csproj_version=$(grep -oPm1 '(?<=<PackageVersion>)[^<]+' RuleMaster/RuleMaster.csproj)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$csproj_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match PackageVersion $csproj_version"
            exit 1
          fi

      # GeneratePackageOnBuild (set in the csproj) breaks a clean multi-target pack with NU5026.
      - name: Pack
        run: dotnet pack RuleMaster/RuleMaster.csproj -c Release -o artifacts -p:GeneratePackageOnBuild=false

      # Exchanges the OIDC token for a NuGet API key valid for 1 hour.
      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org profile name, not email

      # Pushing the .nupkg also uploads the matching .snupkg symbols package.
      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
